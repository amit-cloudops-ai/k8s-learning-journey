apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: resource-demo
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "128Mi"
      defaultRequest:
        cpu: "100m"
        memory: "64Mi"
      max:
        cpu: "500m"
        memory: "256Mi"
