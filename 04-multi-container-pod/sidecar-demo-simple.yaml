apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo-simple
spec:
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "while true; do echo \"$(date '+%Y-%m-%d %H:%M:%S') - log line from main-app\" >> /var/log/app/output.log; sleep 3; done"
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

    - name: log-sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "sleep 5; echo 'Sidecar: about to tail the shared log file...'; tail -f /var/log/app/output.log"
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

  volumes:
    - name: shared-logs
      emptyDir: {}
