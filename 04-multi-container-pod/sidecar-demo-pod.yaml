apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo-pod
  labels:
    app: sidecar-demo
spec:
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          httpd -p 8080 -h /www &
          echo "<h1>Served by main-app container</h1>" > /www/index.html
          i=0
          while true; do
            i=$((i+1))
            echo "$(date '+%Y-%m-%d %H:%M:%S') - log line $i from main-app" >> /var/log/app/output.log
            sleep 3
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
        - name: shared-www
          mountPath: /www
    - name: log-sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          sleep 5
          echo "Sidecar: about to tail the shared log file..."
          tail -f /var/log/app/output.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
  volumes:
    - name: shared-logs
      emptyDir: {}
    - name: shared-www
      emptyDir: {}
