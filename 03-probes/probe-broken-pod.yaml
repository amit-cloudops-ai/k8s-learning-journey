apiVersion: v1
kind: Pod
metadata:
  name: probe-broken-pod
  labels:
    app: probe-broken
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /this-path-does-not-exist
          port: 80
        periodSeconds: 5
        failureThreshold: 3
