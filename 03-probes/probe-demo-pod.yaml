apiVersion: v1
kind: Pod
metadata:
  name: probe-demo-pod
  labels:
    app: probe-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Container starting, sleeping 20s before nginx comes up..."
          sleep 20
          nginx -g "daemon off;"
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 10
        periodSeconds: 3
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 3
